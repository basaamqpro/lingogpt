<!DOCTYPE html>
<html>
<head>
  <title>LingoGPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 80px;
      font-size: 16px;
    }

    .row {
      margin-top: 15px;
      font-size: 18px;
      line-height: 2;
    }

    .token {
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 4px;
      display: inline-block;
      color: white;
      font-weight: bold;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>LingoGPT</h1>

<textarea id="text" placeholder="Enter text..."></textarea>

<br><br>

<select id="lang">
  <option>Arabic</option>
  <option>English</option>
  <option>Japanese</option>
  <option>French</option>
  <option>Yoruba</option>
  <option>Igbo</option>
  <option>Hausa</option>
  <option>Russian</option>
  <option>Urdu</option>
  <option>Spanish</option>
  <option>Algerian Arabic (Darija)</option>
  <option>Tamazight (Berber)</option>
  <option>Amharic</option>
</select>

<br><br>

<button onclick="run()">Translate</button>

<h3>English</h3>
<div id="english" class="row" dir="ltr"></div>

<h3>Translation</h3>
<div id="translated" class="row"></div>

<h3>Transliteration</h3>
<div id="translit" class="row" dir="ltr"></div>

<script>

// Color palette
const palette = [
  "red","blue","green","orange","purple","teal",
  "brown","pink","gold","navy","magenta","lime",
  "indigo","turquoise"
];

function color(i) {
  return palette[i % palette.length];
}

// API call to your Vercel backend
async function callAPI(prompt) {
  const res = await fetch("/api/translate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ prompt })
  });

  const data = await res.json();

  // 🔍 DEBUG (see what API actually returned)
  console.log("FULL API RESPONSE:", data);

  let raw = "";

  // ✅ Main format
  if (data.output && data.output[0]?.content?.[0]?.text) {
    raw = data.output[0].content[0].text;
  }

  // ✅ Fallback format (important)
  else if (data.output_text) {
    raw = data.output_text;
  }

  // ❌ If still nothing → show error
  else {
    console.error("Unexpected API format:", data);
    alert("API returned unexpected format");
    return;
  }

  return JSON.parse(raw);
}

// Render tokens
function render(containerId, tokens, key) {
  document.getElementById(containerId).innerHTML =
    tokens.map((t, i) =>
      `<span class="token" style="background:${color(i)}">
        ${t[key] || ""}
      </span>`
    ).join(" ");
}

// Detect RTL languages
function applyDirection(lang) {
  const rtlLanguages = ["Arabic", "Hebrew", "Urdu"];
  const isRTL = rtlLanguages.includes(lang);

  document.getElementById("translated").dir = isRTL ? "rtl" : "ltr";
}

// Main function
async function run() {

  const text = document.getElementById("text").value.trim();
  const lang = document.getElementById("lang").value;

  if (!text) {
    alert("Please enter text");
    return;
  }

  applyDirection(lang);

  // =========================
  // STEP 1: TRANSLATION
  // =========================
  const step1Prompt = `
Translate into ${lang}.

Always provide transliteration in Latin script if the language is non-Latin.
If already Latin, return "".

Output ONLY JSON:
{
  "translation": "",
  "transliteration": ""
}

Text:
${text}
`;

  const step1 = await callAPI(step1Prompt);

  // =========================
  // STEP 2: TOKEN ALIGNMENT
  // =========================
  const step2Prompt = `
You are building a word-level translation alignment system.

The translation is the SOURCE OF TRUTH.

Task:
Break translation into WORD TOKENS and align each with English and transliteration.

Rules:
- Each token = 1 translation word
- English can be 1–3 words per token
- Keep order exactly the same
- DO NOT merge sentences
- DO NOT invent words
- Assign a color per token

English:
${text}

Translation:
${step1.translation}

Transliteration:
${step1.transliteration}

Output ONLY JSON:

{
  "tokens": [
    {
      "translation": "",
      "english": "",
      "transliteration": "",
      "color": ""
    }
  ]
}
`;

  const step2 = await callAPI(step2Prompt);

  const tokens = step2.tokens;

  // =========================
  // RENDER
  // =========================
  render("english", tokens, "english");
  render("translated", tokens, "translation");
  render("translit", tokens, "transliteration");

  // Debug (optional)
  console.log("TOKENS:", tokens);
}

</script>

</body>
</html>
