<!DOCTYPE html>
<html>
<head>
  <title>LingoGPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial;
      padding: 20px;
      max-width: 950px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
    }

    .row {
      margin-top: 15px;
      font-size: 20px;
      line-height: 2;
    }

    .token {
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 4px;
      display: inline-block;
      color: white;
      font-weight: bold;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<h1>LingoGPT</h1>

<textarea id="text" placeholder="Enter text..."></textarea>

<br><br>

<select id="lang">
  <option>Arabic</option>
  <option>Japanese</option>
  <option>French</option>
  <option>Spanish</option>
  <option>English</option>
</select>

<br><br>

<button onclick="run()">
  Translate
</button>

<button onclick="playAudio()">
  🔊 Play Translation
</button>

<h3>Input</h3>
<div id="inputText" class="row"></div>

<h3>Normalized Input (Script Version)</h3>
<div id="scriptVersion" class="row"></div>

<h3>Input Transliteration</h3>
<div id="inputTranslit" class="row"></div>

<h3>Translation</h3>
<div id="translated" class="row"></div>

<h3>Output Transliteration</h3>
<div id="outputTranslit" class="row"></div>

<h3>Natural Pronunciation</h3>
<div id="naturalPronunciation" class="row"></div>

<script>

// ----------------------
// COLORS
// ----------------------

const palette = [
  "#e6194b",
  "#3cb44b",
  "#ffe119",
  "#4363d8",
  "#f58231",
  "#911eb4",
  "#46f0f0",
  "#f032e6",
  "#bcf60c",
  "#fabebe",
  "#008080",
  "#e6beff",
  "#9a6324",
  "#fffac8"
];

function getColor(index) {
  return palette[index % palette.length];
}

// ----------------------
// LANGUAGE → GOOGLE VOICE
// ----------------------

const voiceMap = {
  Arabic: "ar-XA",
  Japanese: "ja-JP",
  French: "fr-FR",
  Spanish: "es-ES",
  English: "en-GB"
};

// ----------------------
// API CALL
// ----------------------

async function callAPI(prompt) {

  const res = await fetch("/api/translate", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      prompt
    })
  });

  const data = await res.json();

  console.log("API RESPONSE:", data);

  let raw = "";

  if (data.output && data.output[0]?.content?.[0]?.text) {
    raw = data.output[0].content[0].text;
  }

  else if (data.output_text) {
    raw = data.output_text;
  }

  else {
    console.error(data);
    alert("Bad API response");
    return;
  }

  return JSON.parse(raw);
}

// ----------------------
// RENDER
// ----------------------

function render(containerId, tokens) {

  document.getElementById(containerId).innerHTML =

    tokens.map(token => {

      return `
        <span
          class="token"
          style="background:${getColor(token.index)}"
        >
          ${token.word}
        </span>
      `;

    }).join(" ");
}

// ----------------------
// PLAY AUDIO
// ----------------------

async function playAudio() {

  const lang =
    document.getElementById("lang").value;

  const text =
    document.getElementById("translated")
    .innerText;

  if (!text.trim()) {
    alert("No translation yet");
    return;
  }

  const res = await fetch("/api/speak", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      text,
      languageCode: voiceMap[lang]
    })

  });

  const data = await res.json();

  console.log("TTS RESPONSE:", data);

  const audio = new Audio(
    "data:audio/mp3;base64," + data.audioContent
  );

  audio.play();
}

// ----------------------
// MAIN
// ----------------------

async function run() {

  const text =
    document.getElementById("text")
    .value
    .trim();

  const lang =
    document.getElementById("lang")
    .value;

  if (!text) {
    alert("Enter text");
    return;
  }

  // ======================
  // STEP 1
  // ======================

  const step1Prompt = `
You are a multilingual translation engine.

TASK:
1. Detect input language automatically
2. Normalize script if needed
3. Translate naturally into ${lang}
4. Provide transliteration
5. Provide easy natural pronunciation

Rules:
- Keep natural grammar
- Transliteration = structured
- Natural pronunciation = easy for English speakers
- No IPA symbols

Output ONLY JSON:

{
  "script_version": "",
  "input_transliteration": "",
  "translation": "",
  "output_transliteration": "",
  "natural_pronunciation": ""
}

Text:
${text}
`;

  const step1 = await callAPI(step1Prompt);

  // ======================
  // STEP 2
  // ======================

  const step2Prompt = `
You are a multilingual alignment engine.

TASK:
Align words across languages using INDEXES.

Rules:
- Preserve original order
- Same meaning = same index
- Repeated concepts reuse same index
- Return arrays only
- No explanations

Input:
${step1.script_version}

Input Transliteration:
${step1.input_transliteration}

Translation:
${step1.translation}

Output Transliteration:
${step1.output_transliteration}

Natural Pronunciation:
${step1.natural_pronunciation}

Output ONLY JSON:

{
  "input": [
    {
      "word": "",
      "index": 0
    }
  ],

  "input_transliteration": [
    {
      "word": "",
      "index": 0
    }
  ],

  "translation": [
    {
      "word": "",
      "index": 0
    }
  ],

  "output_transliteration": [
    {
      "word": "",
      "index": 0
    }
  ],

  "natural_pronunciation": [
    {
      "word": "",
      "index": 0
    }
  ]
}
`;

  const aligned = await callAPI(step2Prompt);

  // ======================
  // RENDER
  // ======================

  document.getElementById("scriptVersion")
    .innerText = step1.script_version;

  render("inputText", aligned.input);

  render(
    "inputTranslit",
    aligned.input_transliteration
  );

  render(
    "translated",
    aligned.translation
  );

  render(
    "outputTranslit",
    aligned.output_transliteration
  );

  render(
    "naturalPronunciation",
    aligned.natural_pronunciation
  );

  console.log("FINAL:", aligned);
}

</script>

</body>
</html>
