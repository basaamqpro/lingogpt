<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding-top:75px;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
}

#menu{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    background:white;
    border-bottom:1px solid #ddd;
    z-index:1000;
}

#menu a{
    text-decoration:none;
    color:#222;
    font-weight:bold;
}

#register_page{
    width:92%;
    max-width:480px;
    margin:30px auto;
    padding:25px;
    background:white;
    border:1px solid #ddd;
    border-radius:15px;
}

h1{
    margin-top:0;
    text-align:center;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #bbb;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2864dc;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

#username_status,
#message{
    min-height:20px;
    margin-top:8px;
    font-size:14px;
}

#message{
    text-align:center;
    font-weight:bold;
}

@media (max-width: 600px) {
    #menu {
        gap: 12px;
        padding: 0 10px;
        overflow-x: auto;
        justify-content: flex-start;
    }
}
</style>
<link href="styles3.css" rel="stylesheet" />
</head>

<body>

<div id="menu">
    <img src="bigo.png" class="bigo_icon" style="height: 75%;" />
    <button id="menu-btn" class="menu-btn">☰</button>
</div>




<nav id="slide-menu" class="slide-menu">
  <button id="close-btn" class="close-btn">&times;</button>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="register.html">Register</a></li>
    <li> <a href="login.html">Login</a></li>
    <li><a href="create_room.html">Create Room</a></li>
    <li><a href="view_rooms.html">Rooms</a></li>
  </ul>
</nav>


<div id="register_page">

    <h1>Create Account</h1>

    <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username">
        <div id="username_status"></div>
    </div>


    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password">
    </div>

    <div class="field">
        <label for="profile_pic">Profile Picture</label>
        <input type="file" id="profile_pic" accept="image/*">
    </div>

    <button id="register_button">Register</button>

    <p id="message"></p>

</div>

<script type="module">

import{
    initializeApp
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import{
    getAuth,
    createUserWithEmailAndPassword
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import{
    getFirestore,
    collection,
    doc,
    query,
    where,
    limit,
    getDocs,
    setDoc,
    serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import{
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig={
    apiKey:"AIzaSyDVh4UFpUIGLIDllXgB4V03PPHncg6llIA",
    authDomain:"two-todolist-project.firebaseapp.com",
    projectId:"two-todolist-project",
    storageBucket:"two-todolist-project.firebasestorage.app",
    messagingSenderId:"981585696379",
    appId:"1:981585696379:web:fcd35ed7176c86c64ef4de"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const database=getFirestore(app);
const storage=getStorage(app);

var usernameInput=document.getElementById("username");
var passwordInput=document.getElementById("password");
var profilePicInput=document.getElementById("profile_pic");
var registerButton=document.getElementById("register_button");
var usernameStatus=document.getElementById("username_status");
var message=document.getElementById("message");

function createUserIdx(){

    return "user_"+
        Date.now()+
        "_"+
        Math.floor(
            Math.random()*10000
        );
}

function createFirebaseLoginEmail(username){

    return username
        .trim()
        .toLowerCase()+
        "@chat-tutorial.example.com";
}

function showMessage(text,colour){

    message.textContent=text;
    message.style.color=colour;
}

async function usernameAlreadyExists(username){

    var usernameQuery=query(
        collection(database,"user_db_details"),
        where(
            "username_lowercase",
            "==",
            username.toLowerCase()
        ),
        limit(1)
    );

    var result=await getDocs(usernameQuery);

    return !result.empty;
}

usernameInput.onchange=async function(){

    var username=usernameInput.value.trim();

    if(username===""){
        usernameStatus.textContent="";
        return;
    }

    usernameStatus.textContent="Checking username...";
    usernameStatus.style.color="black";

    try{

        var exists=await usernameAlreadyExists(username);

        if(exists){
            usernameStatus.textContent="Username already exists";
            usernameStatus.style.color="red";
        }else{
            usernameStatus.textContent="Username is available";
            usernameStatus.style.color="green";
        }

    }catch(error){
        usernameStatus.textContent=error.message;
        usernameStatus.style.color="red";
    }
};

registerButton.onclick=async function(){

    var username=usernameInput.value.trim();
    var password=passwordInput.value;
    var profileFile=profilePicInput.files[0];

    if(username==="" || password===""){
        showMessage(
            "Username and password are required.",
            "red"
        );
        return;
    }

    if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){
        showMessage(
            "Username must be 3-20 characters using letters, numbers or underscore.",
            "red"
        );
        return;
    }

    if(password.length<6){
        showMessage(
            "Password must contain at least 6 characters.",
            "red"
        );
        return;
    }

    registerButton.disabled=true;
    showMessage("Creating account...","black");

    try{

        var exists=await usernameAlreadyExists(username);

        if(exists){
            showMessage("Username already exists.","red");
            registerButton.disabled=false;
            return;
        }

        var firebaseLoginEmail=
            createFirebaseLoginEmail(
                username
            );

        var authResult=
            await createUserWithEmailAndPassword(
                auth,
                firebaseLoginEmail,
                password
            );

        var firebase_uid=authResult.user.uid;
        var user_idx=createUserIdx();

        var profile_pic="";
        var profile_pic_path="";

        if(profileFile){

            var safeFileName=
                profileFile.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );

            profile_pic_path=
                "chat_users/"+
                user_idx+
                "/profile/"+
                Date.now()+
                "_"+
                safeFileName;

            var profileRef=
                ref(
                    storage,
                    profile_pic_path
                );

            await uploadBytes(
                profileRef,
                profileFile
            );

            profile_pic=
                await getDownloadURL(
                    profileRef
                );
        }

        var user_db_details={

            user_idx:user_idx,
            firebase_uid:firebase_uid,
            username:username,
            username_lowercase:
                username.toLowerCase(),
            profile_pic:profile_pic,
            profile_pic_path:profile_pic_path,

            created_at:serverTimestamp(),
            password: password,

            settings:{
                allow_mentions:true,
                notification_mode:"all",
                notification_every:5
            },

            total_unread_messages:0
        };

        await setDoc(
            doc(
                database,
                "user_db_details",
                user_idx
            ),
            user_db_details
        );

        localStorage.setItem(
            "account_details",
            JSON.stringify({
                user_idx:user_idx,
                firebase_uid:firebase_uid,
                username:username,
                profile_pic:profile_pic
            })
        );

        showMessage(
            "Registration successful.",
            "green"
        );

        window.location.href="view_rooms.html";

    }catch(error){

        console.error(error);

        showMessage(
            "Registration error: "+error.message,
            "red"
        );

        registerButton.disabled=false;
    }
};

</script>
<script src="index.js"></script>
</body>
</html>
