<!DOCTYPE html>
<html>
<head>
  <title>LingoGPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 90px;
      font-size: 16px;
    }

    .row {
      margin-top: 15px;
      font-size: 18px;
      line-height: 2;
    }

    .token {
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 4px;
      display: inline-block;
      color: white;
      font-weight: bold;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>LingoGPT</h1>

<textarea id="text" placeholder="Enter text..."></textarea>

<br><br>

<select id="lang">
  <option>Arabic</option>
  <option>Japanese</option>
  <option>French</option>
  <option>Spanish</option>
  <option>English</option>
</select>

<br><br>

<button onclick="run()">Translate</button>

<h3>Input</h3>
<div id="inputText" class="row"></div>

<h3>Input Transliteration</h3>
<div id="inputTranslit" class="row"></div>

<h3>Translation</h3>
<div id="translated" class="row"></div>

<h3>Output Transliteration</h3>
<div id="outputTranslit" class="row"></div>

<script>

// ----------------------
// COLORS (index-based)
// ----------------------
const palette = [
  "#e6194b","#3cb44b","#ffe119","#4363d8",
  "#f58231","#911eb4","#46f0f0","#f032e6",
  "#bcf60c","#fabebe","#008080","#e6beff",
  "#9a6324","#fffac8"
];

function color(i) {
  return palette[i % palette.length];
}

// ----------------------
// API CALL
// ----------------------
async function callAPI(prompt) {
  const res = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });

  const data = await res.json();

  console.log("API RESPONSE:", data);

  let raw = "";

  if (data.output && data.output[0]?.content?.[0]?.text) {
    raw = data.output[0].content[0].text;
  } else {
    console.error(data);
    alert("Bad API response");
    return;
  }

  return JSON.parse(raw);
}

// ----------------------
// RENDER FUNCTION
// ----------------------
function render(containerId, tokens, key) {
  document.getElementById(containerId).innerHTML =
    tokens.map(t =>
      `<span class="token" style="background:${t.color}">
        ${t[key] || ""}
      </span>`
    ).join(" ");
}

// ----------------------
// MAIN
// ----------------------
async function run() {

  const text = document.getElementById("text").value.trim();
  const lang = document.getElementById("lang").value;

  if (!text) {
    alert("Enter text");
    return;
  }

  // =========================
  // STEP 1: FULL TRANSLATION ONLY
  // =========================
  const step1Prompt = `
Translate the text into ${lang}.

Also provide:
- input transliteration
- output transliteration

Rules:
- Keep natural grammar
- Do NOT split into words
- Return full sentences only

Output ONLY JSON:
{
  "translation": "",
  "input_transliteration": "",
  "output_transliteration": ""
}

Text:
${text}
`;

  const step1 = await callAPI(step1Prompt);

  // =========================
  // STEP 2: INPUT SEGMENTATION ONLY (NO TRANSLATION ALIGNMENT)
  // =========================
  const step2Prompt = `
You are building a visual alignment system.

Task:
Split the INPUT text into meaningful tokens only.

Rules:
- Do NOT translate anything
- Do NOT reorder text
- Do NOT combine incorrect segments
- Assign each token:
  - index (starting from 0)
  - color (unique per index)
  - input transliteration (if possible, otherwise "")

Input:
${text}

Output ONLY JSON:

{
  "tokens": [
    {
      "input": "",
      "input_transliteration": "",
      "index": 0,
      "color": ""
    }
  ]
}
`;

  const step2 = await callAPI(step2Prompt);

  const tokens = step2.tokens;

  // =========================
  // STEP 3: ALIGNMENT (JS ONLY)
  // =========================
  // Fill translation + transliteration per index

  const translatedWords = step1.translation.split(" ");
  const outputTranslitWords = step1.output_transliteration.split(" ");

  const enriched = tokens.map((t, i) => ({
    ...t,
    translation: translatedWords[i] || "",
    output_transliteration: outputTranslitWords[i] || ""
  }));

  // =========================
  // RENDER
  // =========================
  render("inputText", enriched, "input");
  render("inputTranslit", enriched, "input_transliteration");
  render("translated", enriched, "translation");
  render("outputTranslit", enriched, "output_transliteration");

  console.log("FINAL TOKENS:", enriched);
}

</script>

</body>
</html>
