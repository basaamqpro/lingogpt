<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LingoGPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      color: #111827;
      background: #f8fafc;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* ------------------------------
       TOP BAR
    ------------------------------ */

    .top_bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(8px);
    }

    .top_bar button {
      padding: 9px 12px;
      border-radius: 9px;
      background: #e5e7eb;
      color: #111827;
      font-weight: 700;
    }

    .room_languages {
      overflow: hidden;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ------------------------------
       CHAT AREA
    ------------------------------ */

    #chat_page_id {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 12px 10px 175px;
    }

    .empty_chat {
      margin: 40px auto;
      color: #64748b;
      text-align: center;
    }

    .message_row {
      display: flex;
      width: 100%;
      margin: 10px 0 20px;
    }

    .message_row.right {
      justify-content: flex-end;
    }

    .message_row.left {
      justify-content: flex-start;
    }

    .message_bubble {
      width: min(78%, 720px);
      max-width: 100%;
    }

    .translation_sentence {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      padding: 12px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.07);
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .message_row.right .translation_sentence {
      border-bottom-right-radius: 4px;
    }

    .message_row.left .translation_sentence {
      border-bottom-left-radius: 4px;
    }

    .translation_group {
      display: inline-flex;
      flex: 0 0 auto;
      min-width: max-content;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 4px 6px 7px;
      border-bottom: 4px solid #4363d8;
      text-align: center;
    }

    .translation_group span {
      display: block;
      margin: 0;
      white-space: nowrap;
    }

    .group_pronunciation {
      margin-bottom: 3px !important;
      color: #0369a1;
      font-size: 13px;
      font-weight: 500;
    }

    .group_translation {
      color: #111827;
      font-size: 20px;
      font-weight: 700;
    }

    .group_source {
      margin-top: 3px !important;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }

    /* ------------------------------
       MESSAGE ACTIONS
    ------------------------------ */

    .chat_actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .message_row.right .chat_actions {
      justify-content: flex-end;
    }

    .message_row.left .chat_actions {
      justify-content: flex-start;
    }

    .chat_actions button {
      width: auto;
      padding: 6px 9px;
      border-radius: 8px;
      background: #e5e7eb;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
    }

    .chat_actions .reverse_button {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .chat_actions .delete_button {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* ------------------------------
       FIXED COMPOSER
    ------------------------------ */

    #inputform_div {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      padding:
        9px
        max(10px, env(safe-area-inset-right))
        calc(9px + env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      border-top: 1px solid #d1d5db;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
    }

    .composer {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Row 1: languages */
    .composer_languages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      width: 100%;
    }

    select {
      width: 100%;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #ffffff;
      outline: none;
      font-size: 13px;
    }

    /* Row 2: full-width message */
    #sourceText {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 52px;
      max-height: 120px;
      padding: 10px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      resize: none;
      outline: none;
      background: #ffffff;
      line-height: 1.35;
      font-size: 15px;
    }

    #sourceText:focus,
    select:focus {
      border-color: #2563eb;
      outline: 2px solid rgba(37, 99, 235, 0.12);
    }

    /* Row 3: compact actions */
    .composer_actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      width: 100%;
    }

    #sendButton,
    #interactButton,
    #cancelEditButton {
      width: auto;
      min-width: 72px;
      height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    #sendButton {
      background: #111827;
      color: #ffffff;
    }

    #interactButton {
      background: #2563eb;
      color: #ffffff;
    }

    #sendButton:disabled,
    #interactButton:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #cancelEditButton {
      display: none;
      background: #e5e7eb;
      color: #111827;
    }

    #cancelEditButton.visible {
      display: block;
    }

    #translationStatus {
      display: none;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 7px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    #translationStatus.visible {
      display: block;
      background: #dbeafe;
      color: #1d4ed8;
    }

    #translationStatus.error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 760px) {
      #chat_page_id {
        padding: 8px 7px 190px;
      }

      .message_bubble {
        width: 88%;
      }

      .translation_sentence {
        padding: 10px 8px;
      }

      .group_translation {
        font-size: 18px;
      }

      .group_pronunciation,
      .group_source {
        font-size: 12px;
      }

      #chat_page_id {
        padding-bottom: 220px;
      }

      .composer_languages {
        gap: 6px;
      }

      select {
        height: 34px;
        padding: 0 6px;
        font-size: 12px;
      }

      #sourceText {
        min-height: 50px;
        font-size: 14px;
      }

      .composer_actions {
        gap: 6px;
      }

      #sendButton,
      #interactButton,
      #cancelEditButton {
        min-width: 68px;
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="top_bar">
    <button id="backButton" type="button">
      ‹ Rooms
    </button>

    <div
      id="roomLanguages"
      class="room_languages"
    ></div>
  </header>


  <main id="chat_page_id"></main>


  <div id="inputform_div">

    <div
      id="translationStatus"
      role="status"
      aria-live="polite"
    ></div>

    <div class="composer">

      <div class="composer_languages">
        <select
          id="sourceLang"
          aria-label="Source language"
        ></select>

        <select
          id="targetLang"
          aria-label="Target language"
        ></select>
      </div>

      <textarea
        id="sourceText"
        rows="1"
        placeholder="Type a message..."
      ></textarea>

      <div class="composer_actions">
        <button
          id="cancelEditButton"
          type="button"
        >
          Cancel edit
        </button>

        <button
          id="sendButton"
          type="button"
        >
          Send
        </button>

        <button
          id="interactButton"
          type="button"
        >
          Interact
        </button>
      </div>

    </div>
  </div>


  <script src="results5.js"></script>
  <script src="interact2.js"></script>

  <script>
    "use strict";


    /*
    ==================================================
    STORAGE
    ==================================================
    */

    const STORAGE_KEYS = {
      users: "lingo_user_details",
      data: "lingo_user_data",
      session: "lingo_logged_in_user",
      currentRoom: "lingo_current_room"
    };


    /*
    ==================================================
    STATE
    ==================================================
    */

    const palette = [
      "#e6194b",
      "#3cb44b",
      "#b59b00",
      "#4363d8",
      "#f58231",
      "#911eb4",
      "#008b8b",
      "#f032e6"
    ];


    let user_details =
      readArray(STORAGE_KEYS.users);

    let userLingo_data =
      readArray(STORAGE_KEYS.data);

    let loggedInUserIdx =
      localStorage.getItem(
        STORAGE_KEYS.session
      ) || "";

    let currentRoomIdx =
      localStorage.getItem(
        STORAGE_KEYS.currentRoom
      ) || "";

    let editingChatIdx = "";
    let activeController = null;


    /*
    ==================================================
    BASIC HELPERS
    ==================================================
    */

    function readArray(key) {
      try {
        const value =
          JSON.parse(
            localStorage.getItem(key) ||
            "[]"
          );

        return Array.isArray(value)
          ? value
          : [];
      } catch (error) {
        return [];
      }
    }


    function saveData() {
      localStorage.setItem(
        STORAGE_KEYS.data,
        JSON.stringify(
          userLingo_data
        )
      );
    }


    function createId(prefix) {
      return (
        prefix +
        "_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 10000
        )
      );
    }


    function color(index) {
      return palette[
        Math.abs(
          Number(index) || 0
        ) % palette.length
      ];
    }


    function getLoggedInUser() {
      return user_details.find(
        function(user) {
          return (
            user.user_idx ===
            loggedInUserIdx
          );
        }
      ) || null;
    }


    function getUserData() {
      return userLingo_data.find(
        function(item) {
          return (
            item.user_idx ===
            loggedInUserIdx
          );
        }
      ) || null;
    }


    function getRoom() {
      const userData =
        getUserData();

      if (!userData) {
        return null;
      }

      return userData.rooms.find(
        function(room) {
          return (
            room.room_idx ===
            currentRoomIdx
          );
        }
      ) || null;
    }


    /*
    ==================================================
    PAGE GUARDS
    ==================================================
    */

    if (!getLoggedInUser()) {
      window.location.replace(
        "loginregister.html"
      );
    }


    if (!getRoom()) {
      window.location.replace(
        "welcome.html"
      );
    }


    /*
    ==================================================
    LANGUAGES
    ==================================================
    */

    const supportedLanguages =
      window.LingoGPTResults
        ? LingoGPTResults
            .supportedLanguages
        : [];


    function populateSelect(
      selectId,
      selectedLanguage
    ) {
      const select =
        document.getElementById(
          selectId
        );

      select.innerHTML = "";

      supportedLanguages.forEach(
        function(language) {
          const option =
            document.createElement(
              "option"
            );

          option.value =
            language;

          option.textContent =
            language;

          option.selected =
            language ===
            selectedLanguage;

          select.appendChild(
            option
          );
        }
      );
    }


    /*
    ==================================================
    FLOWS
    ==================================================
    */

    function normalizeFlow(items) {
      if (!Array.isArray(items)) {
        return [];
      }

      return items
        .map(function(item, index) {
          return {
            index: index,

            source:
              String(
                item?.source || ""
              ).trim(),

            target:
              String(
                item?.target ??
                item?.translation ??
                ""
              ).trim(),

            pronunciation:
              String(
                item?.pronunciation ||
                ""
              ).trim()
          };
        })
        .filter(function(item) {
          return (
            item.source ||
            item.target ||
            item.pronunciation
          );
        });
    }


    function getStoredResult(chat) {
      if (
        !Array.isArray(
          chat.prompts_and_answers
        ) ||
        !chat.prompts_and_answers.length
      ) {
        return null;
      }

      const last =
        chat.prompts_and_answers[
          chat.prompts_and_answers.length - 1
        ];

      return (
        last &&
        typeof last.gpt_api_answer ===
          "object"
      )
        ? last.gpt_api_answer
        : null;
    }


    function getTargetFlow(chat) {
      const result =
        getStoredResult(chat);

      return normalizeFlow(
        chat.target_flow ||
        chat.targetFlow ||
        result?.targetFlow ||
        result?.target_flow ||
        chat.groups
      );
    }


    function getSourceFlow(chat) {
      const result =
        getStoredResult(chat);

      return normalizeFlow(
        chat.source_flow ||
        chat.sourceFlow ||
        result?.sourceFlow ||
        result?.source_flow ||
        chat.groups
      );
    }


    /*
    ==================================================
    RENDER CHAT
    ==================================================
    */

    function renderChat() {
      const room =
        getRoom();

      if (!room) {
        return;
      }

      document.getElementById(
        "roomLanguages"
      ).textContent =
        room.source_language +
        " → " +
        room.target_language;


      const container =
        document.getElementById(
          "chat_page_id"
        );

      container.innerHTML = "";


      if (!room.room_data.length) {
        const empty =
          document.createElement(
            "p"
          );

        empty.className =
          "empty_chat";

        empty.textContent =
          "Send your first translation.";

        container.appendChild(
          empty
        );

        return;
      }


      room.room_data.forEach(
        function(chat, chatIndex) {
          const sourceFlowActive =
            chat.display_flow ===
            "source";

          const flow =
            sourceFlowActive
              ? getSourceFlow(chat)
              : getTargetFlow(chat);


          const row =
            document.createElement(
              "div"
            );

          const messageSide =
            chat.message_type === "interaction" ||
            chat.is_interaction === true
              ? "left"
              : chat.message_type === "user"
                ? "right"
                : (
                    chatIndex % 2 === 0
                      ? "right"
                      : "left"
                  );

          row.className =
            "message_row " +
            messageSide;


          const bubble =
            document.createElement(
              "div"
            );

          bubble.className =
            "message_bubble";


          const sentence =
            document.createElement(
              "div"
            );

          sentence.className =
            "translation_sentence";


          flow.forEach(
            function(item, index) {
              const group =
                document.createElement(
                  "span"
                );

              group.className =
                "translation_group";

              group.style
                .borderBottomColor =
                color(index);


              const pronunciation =
                document.createElement(
                  "span"
                );

              pronunciation.className =
                "group_pronunciation";

              pronunciation.dir =
                "ltr";

              pronunciation.textContent =
                item.pronunciation ||
                "\u00A0";


              const translation =
                document.createElement(
                  "span"
                );

              translation.className =
                "group_translation";

              translation.dir =
                "auto";

              translation.textContent =
                item.target ||
                "\u00A0";


              const source =
                document.createElement(
                  "span"
                );

              source.className =
                "group_source";

              source.dir =
                "auto";

              source.textContent =
                item.source ||
                "\u00A0";


              group.append(
                pronunciation,
                translation,
                source
              );

              sentence.appendChild(
                group
              );
            }
          );


          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "chat_actions";


          const reverseButton =
            document.createElement(
              "button"
            );

          reverseButton.type =
            "button";

          reverseButton.className =
            "reverse_button";

          reverseButton.textContent =
            "Reverse";

          reverseButton.onclick =
            function() {
              chat.display_flow =
                sourceFlowActive
                  ? "target"
                  : "source";

              saveData();
              renderChat();
            };


          const editButton =
            document.createElement(
              "button"
            );

          editButton.type =
            "button";

          editButton.textContent =
            "Edit";

          editButton.onclick =
            function() {
              startEdit(
                chat.chat_idx
              );
            };


          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.type =
            "button";

          deleteButton.className =
            "delete_button";

          deleteButton.textContent =
            "Delete";

          deleteButton.onclick =
            function() {
              deleteChat(
                chat.chat_idx
              );
            };


          actions.append(
            reverseButton,
            editButton,
            deleteButton
          );


          bubble.append(
            sentence,
            actions
          );

          row.appendChild(
            bubble
          );

          container.appendChild(
            row
          );
        }
      );


      window.requestAnimationFrame(
        function() {
          window.scrollTo({
            top:
              document.body.scrollHeight,
            behavior: "smooth"
          });
        }
      );
    }


    /*
    ==================================================
    EDIT
    ==================================================
    */

    function getPrompt(chat) {
      if (
        Array.isArray(
          chat.prompts_and_answers
        ) &&
        chat.prompts_and_answers.length
      ) {
        return String(
          chat.prompts_and_answers[
            chat.prompts_and_answers.length - 1
          ].user_prompt || ""
        );
      }

      return "";
    }


    function startEdit(chatIdx) {
      const room =
        getRoom();

      const chat =
        room?.room_data.find(
          function(item) {
            return (
              item.chat_idx ===
              chatIdx
            );
          }
        );

      if (!chat) {
        return;
      }


      editingChatIdx =
        chat.chat_idx;


      document.getElementById(
        "sourceText"
      ).value =
        getPrompt(chat);


      populateSelect(
        "sourceLang",
        chat.source_language ||
        room.source_language
      );

      populateSelect(
        "targetLang",
        chat.target_language ||
        room.target_language
      );


      document.getElementById(
        "sendButton"
      ).textContent =
        "Update";


      document.getElementById(
        "cancelEditButton"
      ).classList.add(
        "visible"
      );


      document.getElementById(
        "sourceText"
      ).focus();
    }


    function cancelEdit() {
      editingChatIdx = "";

      document.getElementById(
        "sourceText"
      ).value = "";

      document.getElementById(
        "sendButton"
      ).textContent =
        "Send";

      document.getElementById(
        "cancelEditButton"
      ).classList.remove(
        "visible"
      );

      setComposerLanguages();
      setStatus("");
    }


    /*
    ==================================================
    DELETE
    ==================================================
    */

    function deleteChat(chatIdx) {
      const room =
        getRoom();

      if (!room) {
        return;
      }


      if (
        !confirm(
          "Delete this translation?"
        )
      ) {
        return;
      }


      room.room_data =
        room.room_data.filter(
          function(chat) {
            return (
              chat.chat_idx !==
              chatIdx
            );
          }
        );


      if (
        editingChatIdx ===
        chatIdx
      ) {
        cancelEdit();
      }


      saveData();
      renderChat();
    }


    /*
    ==================================================
    STATUS
    ==================================================
    */

    function setStatus(
      message,
      type
    ) {
      const box =
        document.getElementById(
          "translationStatus"
        );

      box.textContent =
        message || "";

      box.className = "";

      if (message) {
        box.classList.add(
          "visible"
        );

        if (type === "error") {
          box.classList.add(
            "error"
          );
        }
      }
    }


    /*
    ==================================================
    SEND / UPDATE
    ==================================================
    */

    async function sendTranslation() {
      const room =
        getRoom();

      if (!room) {
        return;
      }


      const text =
        document.getElementById(
          "sourceText"
        ).value.trim();

      const sourceLanguage =
        document.getElementById(
          "sourceLang"
        ).value;

      const targetLanguage =
        document.getElementById(
          "targetLang"
        ).value;

      const sendButton =
        document.getElementById(
          "sendButton"
        );

      const interactButton =
        document.getElementById(
          "interactButton"
        );


      if (!text) {
        setStatus(
          "Enter some text.",
          "error"
        );

        return;
      }


      if (
        sourceLanguage ===
        targetLanguage
      ) {
        setStatus(
          "Choose different languages.",
          "error"
        );

        return;
      }


      if (activeController) {
        activeController.abort();
      }


      const controller =
        new AbortController();

      activeController =
        controller;


      sendButton.disabled = true;
      interactButton.disabled = true;

      sendButton.textContent =
        editingChatIdx
          ? "Updating..."
          : "Sending...";


      setStatus(
        "Translating..."
      );


      try {
        const results =
          await LingoGPTResults
            .generateResults({
              text: text,

              sourceLanguage:
                sourceLanguage,

              targetLanguage:
                targetLanguage,

              signal:
                controller.signal,

              onStatus:
                function(message) {
                  if (
                    activeController ===
                    controller &&
                    message !==
                    "Complete."
                  ) {
                    setStatus(
                      message
                    );
                  }
                }
            });


        if (
          activeController !==
          controller
        ) {
          return;
        }


        const oldChat =
          editingChatIdx
            ? room.room_data.find(
                function(chat) {
                  return (
                    chat.chat_idx ===
                    editingChatIdx
                  );
                }
              )
            : null;


        const chatData = {
          chat_idx:
            editingChatIdx ||
            createId("chat"),

          message_type:
            oldChat &&
            oldChat.message_type
              ? oldChat.message_type
              : "user",

          is_interaction:
            oldChat &&
            oldChat.is_interaction === true,

          source_language:
            results.detectedLanguage ||
            sourceLanguage,

          target_language:
            results.targetLanguage ||
            targetLanguage,

          target_flow:
            Array.isArray(
              results.targetFlow
            )
              ? results.targetFlow
              : [],

          source_flow:
            Array.isArray(
              results.sourceFlow
            )
              ? results.sourceFlow
              : [],

          groups:
            Array.isArray(
              results.groups
            )
              ? results.groups
              : [],

          display_flow:
            oldChat &&
            oldChat.display_flow ===
              "source"
              ? "source"
              : "target",

          prompts_and_answers: [
            {
              user_prompt:
                text,

              gpt_api_answer:
                results
            }
          ],

          generated_at:
            results.generatedAt
        };


        if (editingChatIdx) {
          const index =
            room.room_data.findIndex(
              function(chat) {
                return (
                  chat.chat_idx ===
                  editingChatIdx
                );
              }
            );

          if (index !== -1) {
            room.room_data[index] =
              chatData;
          }
        } else {
          room.room_data.push(
            chatData
          );
        }


        saveData();

        editingChatIdx = "";

        document.getElementById(
          "sourceText"
        ).value = "";

        document.getElementById(
          "cancelEditButton"
        ).classList.remove(
          "visible"
        );

        setStatus("");
        setComposerLanguages();
        renderChat();

      } catch (error) {
        if (
          error.name !==
          "AbortError"
        ) {
          console.error(error);

          setStatus(
            error.message ||
            "Translation failed.",
            "error"
          );
        }
      } finally {
        if (
          activeController ===
          controller
        ) {
          activeController = null;

          sendButton.disabled =
            false;

          interactButton.disabled =
            false;

          sendButton.textContent =
            editingChatIdx
              ? "Update"
              : "Send";
        }
      }
    }


    /*
    ==================================================
    INTERACT

    ChatGPT reads previous room messages,
    writes one simple source-language reply,
    then interact.js sends that reply through
    results.js for translation and breakdown.
    ==================================================
    */

    async function interactWithRoom() {
      const room =
        getRoom();

      if (!room) {
        return;
      }


      if (editingChatIdx) {
        setStatus(
          "Finish or cancel editing first.",
          "error"
        );

        return;
      }


      if (
        !window.LingoGPTInteract ||
        typeof LingoGPTInteract.interact !==
          "function"
      ) {
        setStatus(
          "interact.js is not loaded.",
          "error"
        );

        return;
      }


      const sendButton =
        document.getElementById(
          "sendButton"
        );

      const interactButton =
        document.getElementById(
          "interactButton"
        );


      if (activeController) {
        activeController.abort();
      }


      const controller =
        new AbortController();

      activeController =
        controller;


      sendButton.disabled = true;
      interactButton.disabled = true;

      interactButton.textContent =
        "Thinking...";


      setStatus(
        "Reading the conversation..."
      );


      try {
        const results =
          await LingoGPTInteract.interact({
            signal:
              controller.signal,

            onStatus:
              function(message) {
                if (
                  activeController ===
                    controller &&
                  message !==
                    "Complete."
                ) {
                  setStatus(
                    message
                  );
                }
              }
          });


        if (
          activeController !==
          controller
        ) {
          return;
        }


        const interactionText =
          String(
            results.interactionText ||
            results.request?.text ||
            ""
          ).trim();


        const chatData = {
          chat_idx:
            createId("chat"),

          message_type:
            "interaction",

          is_interaction:
            true,

          source_language:
            results.detectedLanguage ||
            room.source_language,

          target_language:
            results.targetLanguage ||
            room.target_language,

          target_flow:
            Array.isArray(
              results.targetFlow
            )
              ? results.targetFlow
              : [],

          source_flow:
            Array.isArray(
              results.sourceFlow
            )
              ? results.sourceFlow
              : [],

          groups:
            Array.isArray(
              results.groups
            )
              ? results.groups
              : [],

          display_flow:
            "target",

          prompts_and_answers: [
            {
              user_prompt:
                interactionText,

              gpt_api_answer:
                results
            }
          ],

          generated_at:
            results.generatedAt ||
            new Date().toISOString()
        };


        room.room_data.push(
          chatData
        );


        saveData();

        setStatus("");
        renderChat();

      } catch (error) {
        if (
          error.name !==
          "AbortError"
        ) {
          console.error(error);

          setStatus(
            error.message ||
            "Interaction failed.",
            "error"
          );
        }

      } finally {
        if (
          activeController ===
          controller
        ) {
          activeController = null;

          sendButton.disabled =
            false;

          interactButton.disabled =
            false;

          interactButton.textContent =
            "Interact";
        }
      }
    }


    /*
    ==================================================
    COMPOSER
    ==================================================
    */

    function setComposerLanguages() {
      const room =
        getRoom();

      if (!room) {
        return;
      }

      populateSelect(
        "sourceLang",
        room.source_language ||
        "English"
      );

      populateSelect(
        "targetLang",
        room.target_language ||
        "Japanese"
      );
    }


    function resizeComposer() {
      const textarea =
        document.getElementById(
          "sourceText"
        );

      textarea.style.height =
        "44px";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          120
        ) + "px";
    }


    /*
    ==================================================
    EVENTS
    ==================================================
    */

    document.getElementById(
      "backButton"
    ).addEventListener(
      "click",
      function() {
        window.location.href =
          "welcome.html";
      }
    );


    document.getElementById(
      "sendButton"
    ).addEventListener(
      "click",
      sendTranslation
    );


    document.getElementById(
      "interactButton"
    ).addEventListener(
      "click",
      interactWithRoom
    );


    document.getElementById(
      "cancelEditButton"
    ).addEventListener(
      "click",
      cancelEdit
    );


    document.getElementById(
      "sourceText"
    ).addEventListener(
      "input",
      resizeComposer
    );


    document.getElementById(
      "sourceText"
    ).addEventListener(
      "keydown",
      function(event) {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendTranslation();
        }
      }
    );


    /*
    ==================================================
    START
    ==================================================
    */

    const room =
      getRoom();

    if (room) {
      if (
        !Array.isArray(
          room.room_data
        )
      ) {
        room.room_data = [];
        saveData();
      }

      setComposerLanguages();
      renderChat();
      resizeComposer();
    }
  </script>

</body>
</html>
