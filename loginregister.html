<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LingoGPT - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #111827;
      background: #f8fafc;
    }

    .auth_page {
      width: 100%;
      max-width: 900px;
    }

    .app_title {
      margin-bottom: 25px;
      text-align: center;
    }

    .app_title h1 {
      margin-bottom: 7px;
    }

    .app_title p {
      margin: 0;
      color: #64748b;
    }

    .auth_tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .auth_tabs button {
      width: auto;
      min-width: 120px;
    }

    .auth_tabs button.active {
      background: #111827;
      color: white;
    }

    .auth_tabs button:not(.active) {
      background: #e5e7eb;
      color: #111827;
    }

    .auth_container {
      max-width: 500px;
      margin: 0 auto;
    }

    .panel {
      display: none;
      padding: 25px;
      border: 1px solid #d1d5db;
      border-radius: 15px;
      background: white;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font: inherit;
      font-size: 16px;
    }

    input:focus {
      border-color: #2563eb;
      outline: 2px solid rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      padding: 12px 15px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .submit_button {
      margin-top: 20px;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .muted {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .switch_text {
      margin-top: 20px;
      text-align: center;
      color: #64748b;
    }

    .text_button {
      width: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: #2563eb;
      font-weight: bold;
    }

    .password_wrapper {
      position: relative;
    }

    .password_wrapper input {
      padding-right: 75px;
    }

    .show_password_button {
      position: absolute;
      top: 50%;
      right: 8px;
      width: auto;
      padding: 6px 9px;
      transform: translateY(-50%);
      background: #e5e7eb;
      color: #111827;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 15px;
      }

      .auth_page {
        margin-top: 30px;
      }

      .panel {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="auth_page">

    <div class="app_title">
      <h1>LingoGPT</h1>

      <p>
        Learn languages through translation,
        pronunciation and sentence breakdown.
      </p>
    </div>

    <div id="authMessage" class="message"></div>

    <div class="auth_tabs">
      <button
        id="showLoginButton"
        class="active"
        type="button"
      >
        Login
      </button>

      <button
        id="showRegisterButton"
        type="button"
      >
        Register
      </button>
    </div>

    <div class="auth_container">

      <!-- LOGIN -->

      <form
        id="loginForm"
        class="panel active"
      >

        <h2>Login</h2>

        <p class="muted">
          Login to access your saved rooms and translations.
        </p>

        <label for="loginUsername">
          Username
        </label>

        <input
          id="loginUsername"
          type="text"
          autocomplete="username"
          required
        >

        <label for="loginPassword">
          Password
        </label>

        <div class="password_wrapper">

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >

          <button
            class="show_password_button"
            type="button"
            data-password-input="loginPassword"
          >
            Show
          </button>

        </div>

        <button
          id="loginButton"
          class="submit_button"
          type="submit"
        >
          Login
        </button>

        <p class="switch_text">
          Don't have an account?

          <button
            id="openRegisterButton"
            class="text_button"
            type="button"
          >
            Register
          </button>
        </p>

      </form>


      <!-- REGISTER -->

      <form
        id="registerForm"
        class="panel"
      >

        <h2>Create Account</h2>

        <p class="muted">
          Create an account to save your language rooms
          and translations.
        </p>

        <label for="registerName">
          Full name
        </label>

        <input
          id="registerName"
          type="text"
          autocomplete="name"
          required
        >

        <label for="registerUsername">
          Username
        </label>

        <input
          id="registerUsername"
          type="text"
          autocomplete="username"
          required
        >

        <label for="registerEmail">
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          required
        >

        <label for="registerPassword">
          Password
        </label>

        <div class="password_wrapper">

          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            required
          >

          <button
            class="show_password_button"
            type="button"
            data-password-input="registerPassword"
          >
            Show
          </button>

        </div>

        <label for="confirmPassword">
          Confirm password
        </label>

        <div class="password_wrapper">

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            required
          >

          <button
            class="show_password_button"
            type="button"
            data-password-input="confirmPassword"
          >
            Show
          </button>

        </div>

        <button
          id="registerButton"
          class="submit_button"
          type="submit"
        >
          Create Account
        </button>

        <p class="switch_text">
          Already have an account?

          <button
            id="openLoginButton"
            class="text_button"
            type="button"
          >
            Login
          </button>
        </p>

      </form>

    </div>

  </main>


  <script>
    "use strict";


    /*
    ==================================================
    LOCAL STORAGE
    ==================================================
    */

    const STORAGE_KEYS = {
      users: "lingo_user_details",
      data: "lingo_user_data",
      session: "lingo_logged_in_user"
    };


    /*
    ==================================================
    DEFAULT USERS

    These are only created when user data does not
    already exist in localStorage.
    ==================================================
    */

    const DEFAULT_USERS = [
      {
        name: "Basaam Daniel",
        email: "Basaamqpro@gmail.com",
        website: "portfolio1.com",
        experience: 5,
        username: "Basaamqpro",
        user_idx: "user_basaam",
        profile_pic: "Basaam.jpg",
        cv: "BasaamCV.pdf",
        password: "12345"
      },

      {
        name: "John Oliver",
        hide_name: false,
        email: "john_o@gmail.com",
        website: "portfolio2.com",
        experience: 6,
        username: "khalidAliyu",
        user_idx: "user_khalid",
        profile_pic: "john.jpg",
        cv: "JohnCV.pdf",
        password: "12345"
      }
    ];


    /*
    ==================================================
    LOAD DATA
    ==================================================
    */

    function clone(value) {
      return JSON.parse(
        JSON.stringify(value)
      );
    }


    function loadUsers() {
      const savedUsers =
        localStorage.getItem(
          STORAGE_KEYS.users
        );

      if (savedUsers) {
        try {
          return JSON.parse(savedUsers);
        } catch (error) {
          console.warn(
            "Invalid saved users.",
            error
          );
        }
      }

      const users =
        clone(DEFAULT_USERS);

      localStorage.setItem(
        STORAGE_KEYS.users,
        JSON.stringify(users)
      );

      return users;
    }


    function loadLingoData() {
      const savedData =
        localStorage.getItem(
          STORAGE_KEYS.data
        );

      if (savedData) {
        try {
          return JSON.parse(savedData);
        } catch (error) {
          console.warn(
            "Invalid saved LingoGPT data.",
            error
          );
        }
      }

      const initialData = [];

      DEFAULT_USERS.forEach(
        function(user) {
          initialData.push({
            user_idx:
              user.user_idx,

            username:
              user.username,

            rooms: []
          });
        }
      );

      localStorage.setItem(
        STORAGE_KEYS.data,
        JSON.stringify(initialData)
      );

      return initialData;
    }


    let user_details =
      loadUsers();

    let userLingo_data =
      loadLingoData();


    /*
    ==================================================
    HELPERS
    ==================================================
    */

    function createId(prefix) {
      return (
        prefix +
        "_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 10000
        )
      );
    }


    function saveUsers() {
      localStorage.setItem(
        STORAGE_KEYS.users,
        JSON.stringify(user_details)
      );
    }


    function saveLingoData() {
      localStorage.setItem(
        STORAGE_KEYS.data,
        JSON.stringify(userLingo_data)
      );
    }


    function saveSession(userIdx) {
      localStorage.setItem(
        STORAGE_KEYS.session,
        userIdx
      );
    }


    function showMessage(
      message,
      type
    ) {
      const box =
        document.getElementById(
          "authMessage"
        );

      box.textContent =
        message || "";

      box.className =
        "message";

      if (message) {
        box.classList.add(
          "visible",
          type === "error"
            ? "error"
            : "success"
        );
      }
    }


    function clearMessage() {
      showMessage("");
    }


    /*
    ==================================================
    SWITCH LOGIN / REGISTER
    ==================================================
    */

    function showLogin() {
      clearMessage();

      document
        .getElementById(
          "loginForm"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "registerForm"
        )
        .classList.remove(
          "active"
        );

      document
        .getElementById(
          "showLoginButton"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "showRegisterButton"
        )
        .classList.remove(
          "active"
        );

      document
        .getElementById(
          "loginUsername"
        )
        .focus();
    }


    function showRegister() {
      clearMessage();

      document
        .getElementById(
          "loginForm"
        )
        .classList.remove(
          "active"
        );

      document
        .getElementById(
          "registerForm"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "showLoginButton"
        )
        .classList.remove(
          "active"
        );

      document
        .getElementById(
          "showRegisterButton"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "registerName"
        )
        .focus();
    }


    /*
    ==================================================
    LOGIN
    ==================================================
    */

    function login() {
      const username =
        document
          .getElementById(
            "loginUsername"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;

      if (
        !username ||
        !password
      ) {
        showMessage(
          "Enter your username and password.",
          "error"
        );

        return;
      }

      const user =
        user_details.find(
          function(item) {
            return (
              String(
                item.username
              )
                .toLowerCase() ===
                username.toLowerCase() &&

              String(
                item.password
              ) ===
                String(password)
            );
          }
        );

      if (!user) {
        showMessage(
          "Incorrect username or password.",
          "error"
        );

        return;
      }

      saveSession(
        user.user_idx
      );

      showMessage(
        "Login successful.",
        "success"
      );

      /*
      Go to main LingoGPT page.
      */

      window.location.href =
        "index.html";
    }


    /*
    ==================================================
    REGISTER
    ==================================================
    */

    function register() {
      const name =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim();

      const username =
        document
          .getElementById(
            "registerUsername"
          )
          .value
          .trim();

      const email =
        document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "registerPassword"
          )
          .value;

      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      if (
        !name ||
        !username ||
        !email ||
        !password ||
        !confirmPassword
      ) {
        showMessage(
          "Complete all registration fields.",
          "error"
        );

        return;
      }


      if (
        password !==
        confirmPassword
      ) {
        showMessage(
          "The passwords do not match.",
          "error"
        );

        return;
      }


      const usernameExists =
        user_details.some(
          function(user) {
            return (
              String(
                user.username
              )
                .toLowerCase() ===
              username.toLowerCase()
            );
          }
        );


      if (usernameExists) {
        showMessage(
          "That username already exists.",
          "error"
        );

        return;
      }


      const emailExists =
        user_details.some(
          function(user) {
            return (
              String(
                user.email || ""
              )
                .toLowerCase() ===
              email.toLowerCase()
            );
          }
        );


      if (emailExists) {
        showMessage(
          "An account already uses that email.",
          "error"
        );

        return;
      }


      const newUser = {
        name: name,

        email: email,

        website: "",

        experience: 0,

        username:
          username,

        user_idx:
          createId("user"),

        profile_pic: "",

        cv: "",

        password:
          password
      };


      /*
      Add account.
      */

      user_details.push(
        newUser
      );


      /*
      Create this user's own
      LingoGPT data area.
      */

      userLingo_data.push({
        user_idx:
          newUser.user_idx,

        username:
          newUser.username,

        rooms: []
      });


      saveUsers();
      saveLingoData();


      /*
      Automatically log in
      after registration.
      */

      saveSession(
        newUser.user_idx
      );


      showMessage(
        "Account created successfully.",
        "success"
      );


      /*
      Go to main page.
      */

      window.location.href =
        "index.html";
    }


    /*
    ==================================================
    SHOW / HIDE PASSWORD
    ==================================================
    */

    function togglePassword(button) {
      const inputId =
        button.dataset.passwordInput;

      const input =
        document.getElementById(
          inputId
        );

      if (!input) {
        return;
      }

      const hidden =
        input.type ===
        "password";

      input.type =
        hidden
          ? "text"
          : "password";

      button.textContent =
        hidden
          ? "Hide"
          : "Show";
    }


    /*
    ==================================================
    EVENTS
    ==================================================
    */

    document
      .getElementById(
        "loginForm"
      )
      .addEventListener(
        "submit",
        function(event) {
          event.preventDefault();
          login();
        }
      );


    document
      .getElementById(
        "registerForm"
      )
      .addEventListener(
        "submit",
        function(event) {
          event.preventDefault();
          register();
        }
      );


    document
      .getElementById(
        "showLoginButton"
      )
      .addEventListener(
        "click",
        showLogin
      );


    document
      .getElementById(
        "showRegisterButton"
      )
      .addEventListener(
        "click",
        showRegister
      );


    document
      .getElementById(
        "openLoginButton"
      )
      .addEventListener(
        "click",
        showLogin
      );


    document
      .getElementById(
        "openRegisterButton"
      )
      .addEventListener(
        "click",
        showRegister
      );


    document
      .querySelectorAll(
        ".show_password_button"
      )
      .forEach(
        function(button) {
          button.addEventListener(
            "click",
            function() {
              togglePassword(
                button
              );
            }
          );
        }
      );


    /*
    ==================================================
    EXISTING SESSION

    If somebody is already logged in,
    send them directly to index.html.
    ==================================================
    */

    const savedSession =
      localStorage.getItem(
        STORAGE_KEYS.session
      );


    if (savedSession) {
      const validSession =
        user_details.some(
          function(user) {
            return (
              user.user_idx ===
              savedSession
            );
          }
        );

      if (validSession) {
        window.location.replace(
          "index.html"
        );
      } else {
        localStorage.removeItem(
          STORAGE_KEYS.session
        );
      }
    }
  </script>

</body>
</html>
