<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LingoGPT - Rooms</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #111827;
      background: #f8fafc;
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    .panel {
      margin-bottom: 18px;
      padding: 20px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background: #ffffff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header h1 {
      margin: 0 0 5px;
    }

    .header p {
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      font: inherit;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    button {
      border: 0;
      cursor: pointer;
      background: #111827;
      color: #ffffff;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button.danger {
      background: #b91c1c;
    }

    .button_row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .button_row button,
    .room_actions button,
    .header button {
      width: auto;
      min-width: 110px;
    }

    .muted {
      color: #64748b;
    }

    .message {
      display: none;
      margin: 12px 0 18px;
      padding: 12px;
      border-radius: 9px;
      font-weight: bold;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .room_card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #ffffff;
    }

    .room_header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .room_header h3 {
      margin: 0 0 6px;
    }

    .room_header p {
      margin: 0;
    }

    .room_actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .empty {
      padding: 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header,
      .room_header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header button,
      .room_actions button {
        width: 100%;
      }

      .room_actions {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="appMessage" class="message"></div>

  <section class="panel">
    <div class="header">

      <div>
        <h1>
          Welcome,
          <span id="loggedInUsername"></span>
        </h1>

        <p class="muted">
          Choose a language room or create a new one.
        </p>
      </div>

      <button
        id="logoutButton"
        type="button"
        class="secondary"
      >
        Logout
      </button>

    </div>
  </section>


  <section class="panel">
    <h2>Create Room</h2>

    <div class="grid">

      <div>
        <label for="newRoomName">
          Room name
        </label>

        <input
          id="newRoomName"
          type="text"
          placeholder="Japanese practice"
        >
      </div>

      <div>
        <label for="newRoomSourceLanguage">
          Source language
        </label>

        <select id="newRoomSourceLanguage"></select>
      </div>

      <div>
        <label for="newRoomTargetLanguage">
          Target language
        </label>

        <select id="newRoomTargetLanguage"></select>
      </div>

    </div>

    <div class="button_row">
      <button
        id="createRoomButton"
        type="button"
      >
        Create Room
      </button>
    </div>
  </section>


  <section>
    <h2>Your Rooms</h2>

    <div id="show_rooms_names"></div>
  </section>


  <script src="results.js"></script>

  <script>
    "use strict";

    /*
    ==================================================
    STORAGE

    loginregister.html already stores:
    - users
    - language data
    - logged-in user

    welcome.html adds:
    - currently selected room
    ==================================================
    */

    const STORAGE_KEYS = {
      users: "lingo_user_details",
      data: "lingo_user_data",
      session: "lingo_logged_in_user",
      currentRoom: "lingo_current_room"
    };


    /*
    ==================================================
    DATA
    ==================================================
    */

    function loadArray(key) {
      const value =
        localStorage.getItem(key);

      if (!value) {
        return [];
      }

      try {
        const parsed =
          JSON.parse(value);

        return Array.isArray(parsed)
          ? parsed
          : [];
      } catch (error) {
        console.error(
          "Invalid localStorage data:",
          key,
          error
        );

        return [];
      }
    }


    let user_details =
      loadArray(STORAGE_KEYS.users);

    let userLingo_data =
      loadArray(STORAGE_KEYS.data);

    const loggedInUserIdx =
      localStorage.getItem(
        STORAGE_KEYS.session
      ) || "";


    /*
    ==================================================
    AUTH CHECK
    ==================================================
    */

    function getLoggedInUser() {
      return user_details.find(
        function(user) {
          return (
            user.user_idx ===
            loggedInUserIdx
          );
        }
      ) || null;
    }


    const loggedInUser =
      getLoggedInUser();


    if (!loggedInUser) {
      localStorage.removeItem(
        STORAGE_KEYS.session
      );

      localStorage.removeItem(
        STORAGE_KEYS.currentRoom
      );

      window.location.replace(
        "loginregister.html"
      );
    }


    /*
    ==================================================
    HELPERS
    ==================================================
    */

    function saveData() {
      localStorage.setItem(
        STORAGE_KEYS.data,
        JSON.stringify(
          userLingo_data
        )
      );
    }


    function createId(prefix) {
      return (
        prefix +
        "_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 10000
        )
      );
    }


    function showMessage(
      message,
      type
    ) {
      const box =
        document.getElementById(
          "appMessage"
        );

      box.textContent =
        message || "";

      box.className =
        "message";

      if (message) {
        box.classList.add(
          "visible",
          type === "error"
            ? "error"
            : "success"
        );
      }
    }


    function getLoggedInUserData() {
      let userData =
        userLingo_data.find(
          function(item) {
            return (
              item.user_idx ===
              loggedInUserIdx
            );
          }
        );


      /*
      Older/new users may have an account
      but no LingoGPT data record yet.
      */

      if (!userData && loggedInUser) {
        userData = {
          user_idx:
            loggedInUser.user_idx,

          username:
            loggedInUser.username,

          rooms: []
        };

        userLingo_data.push(
          userData
        );

        saveData();
      }


      if (
        userData &&
        !Array.isArray(userData.rooms)
      ) {
        userData.rooms = [];
        saveData();
      }


      return userData || null;
    }


    /*
    ==================================================
    LANGUAGES
    ==================================================
    */

    const fallbackLanguages = [
      "English",
      "Arabic",
      "Hausa",
      "French",
      "Spanish",
      "Portuguese",
      "German",
      "Italian",
      "Dutch",
      "Russian",
      "Ukrainian",
      "Polish",
      "Turkish",
      "Persian",
      "Urdu",
      "Hindi",
      "Bengali",
      "Punjabi",
      "Gujarati",
      "Marathi",
      "Tamil",
      "Telugu",
      "Kannada",
      "Malayalam",
      "Nepali",
      "Sinhala",
      "Mandarin Chinese",
      "Cantonese",
      "Japanese",
      "Korean",
      "Vietnamese",
      "Thai",
      "Indonesian",
      "Malay",
      "Filipino (Tagalog)",
      "Swahili",
      "Somali",
      "Amharic",
      "Yoruba",
      "Igbo",
      "Zulu",
      "Afrikaans",
      "Hebrew",
      "Greek",
      "Romanian",
      "Czech",
      "Hungarian",
      "Swedish",
      "Norwegian",
      "Danish"
    ];


    const supportedLanguages =
      window.LingoGPTResults &&
      Array.isArray(
        LingoGPTResults.supportedLanguages
      )
        ? LingoGPTResults.supportedLanguages
        : fallbackLanguages;


    function populateSelect(
      selectId,
      selectedLanguage
    ) {
      const select =
        document.getElementById(
          selectId
        );

      select.innerHTML = "";


      supportedLanguages.forEach(
        function(language) {
          const option =
            document.createElement(
              "option"
            );

          option.value =
            language;

          option.textContent =
            language;

          option.selected =
            language ===
            selectedLanguage;

          select.appendChild(
            option
          );
        }
      );
    }


    function populateLanguageSelectors() {
      populateSelect(
        "newRoomSourceLanguage",
        "English"
      );

      populateSelect(
        "newRoomTargetLanguage",
        "Japanese"
      );
    }


    /*
    ==================================================
    SHOW ROOMS
    ==================================================
    */

    function showRooms() {
      const userData =
        getLoggedInUserData();

      const container =
        document.getElementById(
          "show_rooms_names"
        );

      container.innerHTML = "";


      if (!userData) {
        showMessage(
          "User data could not be loaded.",
          "error"
        );

        return;
      }


      if (!userData.rooms.length) {
        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "You have no rooms yet. Create your first room above.";

        container.appendChild(
          empty
        );

        return;
      }


      userData.rooms.forEach(
        function(room) {
          const card =
            document.createElement(
              "article"
            );

          card.className =
            "room_card";


          const header =
            document.createElement(
              "div"
            );

          header.className =
            "room_header";


          const details =
            document.createElement(
              "div"
            );


          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            room.room_name ||
            "Untitled Room";


          const languages =
            document.createElement(
              "p"
            );

          languages.className =
            "muted";

          languages.textContent =
            (
              room.source_language ||
              "Source"
            ) +
            " → " +
            (
              room.target_language ||
              "Target"
            ) +
            " · " +
            (
              Array.isArray(
                room.room_data
              )
                ? room.room_data.length
                : 0
            ) +
            " translations";


          details.append(
            title,
            languages
          );


          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "room_actions";


          const openButton =
            document.createElement(
              "button"
            );

          openButton.type =
            "button";

          openButton.textContent =
            "Open Room";

          openButton.onclick =
            function() {
              openRoom(
                room.room_idx
              );
            };


          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.type =
            "button";

          deleteButton.className =
            "danger";

          deleteButton.textContent =
            "Delete";

          deleteButton.onclick =
            function() {
              deleteRoom(
                room.room_idx
              );
            };


          actions.append(
            openButton,
            deleteButton
          );

          header.append(
            details,
            actions
          );

          card.appendChild(
            header
          );

          container.appendChild(
            card
          );
        }
      );
    }


    /*
    ==================================================
    CREATE ROOM
    ==================================================
    */

    function createRoom() {
      const userData =
        getLoggedInUserData();

      const roomName =
        document
          .getElementById(
            "newRoomName"
          )
          .value
          .trim();

      const sourceLanguage =
        document
          .getElementById(
            "newRoomSourceLanguage"
          )
          .value;

      const targetLanguage =
        document
          .getElementById(
            "newRoomTargetLanguage"
          )
          .value;


      if (!userData) {
        showMessage(
          "User data could not be loaded.",
          "error"
        );

        return;
      }


      if (!roomName) {
        showMessage(
          "Enter a room name.",
          "error"
        );

        return;
      }


      if (
        sourceLanguage ===
        targetLanguage
      ) {
        showMessage(
          "Choose different source and target languages.",
          "error"
        );

        return;
      }


      const room = {
        room_idx:
          createId("room"),

        room_name:
          roomName,

        source_language:
          sourceLanguage,

        target_language:
          targetLanguage,

        room_data: []
      };


      userData.rooms.push(
        room
      );


      saveData();


      document.getElementById(
        "newRoomName"
      ).value = "";


      showMessage(
        "Room created.",
        "success"
      );


      showRooms();
    }


    /*
    ==================================================
    OPEN ROOM

    We only save the selected room ID here.

    index.html will read:
    localStorage.getItem("lingo_current_room")
    ==================================================
    */

    function openRoom(roomIdx) {
      const userData =
        getLoggedInUserData();


      if (!userData) {
        return;
      }


      const room =
        userData.rooms.find(
          function(item) {
            return (
              item.room_idx ===
              roomIdx
            );
          }
        );


      if (!room) {
        showMessage(
          "Room was not found.",
          "error"
        );

        return;
      }


      localStorage.setItem(
        STORAGE_KEYS.currentRoom,
        room.room_idx
      );


      window.location.href =
        "index.html";
    }


    /*
    ==================================================
    DELETE ROOM
    ==================================================
    */

    function deleteRoom(roomIdx) {
      const userData =
        getLoggedInUserData();


      if (!userData) {
        return;
      }


      const room =
        userData.rooms.find(
          function(item) {
            return (
              item.room_idx ===
              roomIdx
            );
          }
        );


      if (!room) {
        return;
      }


      const confirmed =
        confirm(
          'Delete "' +
          room.room_name +
          '" and all its saved translations?'
        );


      if (!confirmed) {
        return;
      }


      userData.rooms =
        userData.rooms.filter(
          function(item) {
            return (
              item.room_idx !==
              roomIdx
            );
          }
        );


      const selectedRoom =
        localStorage.getItem(
          STORAGE_KEYS.currentRoom
        );


      if (
        selectedRoom ===
        roomIdx
      ) {
        localStorage.removeItem(
          STORAGE_KEYS.currentRoom
        );
      }


      saveData();


      showMessage(
        "Room deleted.",
        "success"
      );


      showRooms();
    }


    /*
    ==================================================
    LOGOUT
    ==================================================
    */

    function logout() {
      localStorage.removeItem(
        STORAGE_KEYS.session
      );

      localStorage.removeItem(
        STORAGE_KEYS.currentRoom
      );

      window.location.href =
        "loginregister.html";
    }


    /*
    ==================================================
    EVENTS
    ==================================================
    */

    document
      .getElementById(
        "createRoomButton"
      )
      .addEventListener(
        "click",
        createRoom
      );


    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        logout
      );


    document
      .getElementById(
        "newRoomName"
      )
      .addEventListener(
        "keydown",
        function(event) {
          if (
            event.key ===
            "Enter"
          ) {
            event.preventDefault();
            createRoom();
          }
        }
      );


    /*
    ==================================================
    START
    ==================================================
    */

    if (loggedInUser) {
      document.getElementById(
        "loggedInUsername"
      ).textContent =
        loggedInUser.username;

      populateLanguageSelectors();
      showRooms();
    }
  </script>

</body>
</html>
